services:
  db:
    image: postgres:16
    container_name: symptomtracker-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: symptomtracker
      POSTGRES_USER: symptomtracker_user
      POSTGRES_PASSWORD: ${SYMPTOMTRACKER_DB_PASSWORD}

    volumes:
      - symptomtracker_pgdata:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:${DB_PORT}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U symptomtracker_user -d symptomtracker"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  symptomtracker_pgdata:
