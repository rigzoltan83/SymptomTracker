<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ t("export.heading") }} - SymptomTracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

{% include "_language_switcher.html" %}


<main class="container">

    <header class="header">
        <h1>{{ t("export.heading") }}</h1>

        <p>
            {{ t("export.title") }}
        </p>
    </header>


    <section class="edit-card">

        <form
            id="export-form"
        >

            <label class="form-field">

                <span>{{ t("export.start_date") }}</span>

                <input
                    type="date"
                    name="date_from"
                >

            </label>


            <label class="form-field">

                <span>{{ t("export.end_date") }}</span>

                <input
                    type="date"
                    name="date_to"
                >

            </label>


            <label class="form-field">

                <span>{{ t("export.status") }}</span>

                <select name="status">

                    <option value="active">
                        {{ t("export.active_only") }}
                    </option>

                    <option value="all">
                        {{ t("export.all") }}
                    </option>

                    <option value="inactive">
                        {{ t("export.inactive_only") }}
                    </option>

                </select>

            </label>


            <button
                class="primary-button"
                type="button"
                onclick="downloadExport('xlsx')"
            >
                📊 XLSX export
            </button>


            <button
                class="secondary-export-button"
                type="button"
                onclick="downloadExport('csv')"
            >
                📄 CSV export
            </button>

        </form>

    </section>


    <nav class="page-bottom">

<a
    class="home-button"
    href="{{ url_for('main.admin') if return_to == 'admin' else url_for('main.index') }}"
>
    {% if return_to == "admin" %}
        ← {{ t("common.management") }}
    {% else %}
        ← {{ t("common.home") }}
    {% endif %}
</a>

    </nav>


    {% include "_top_back_button.html" %}

</main>


<script>
    function downloadExport(format) {
        const form =
            document.getElementById(
                "export-form"
            );

        const params =
            new URLSearchParams(
                new FormData(form)
            );

        const exportUrls = {
            csv: "{{ url_for('main.export_csv') }}",
            xlsx: "{{ url_for('main.export_xlsx') }}"
        };

        const exportUrl =
            exportUrls[format];

        if (!exportUrl) {
            return;
        }

        window.location.href =
            exportUrl
            + "?"
            + params.toString();
    }
</script>

</body>
</html>
